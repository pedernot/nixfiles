set -g status-interval 5
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# C-b is not acceptable -- Vim uses it
unbind C-b
set -g prefix C-Space
bind-key C-Space last-window

# Start numbering at 1
set -g base-index 1

# Allows for faster key repetition
set -s escape-time 0

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

set -g status-keys emacs
set -g focus-events on

# Vi copypaste mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# hjkl pane resize
bind H resize-pane -L 10
bind J resize-pane -D 10
bind K resize-pane -U 10
bind L resize-pane -R 10

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
| grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

is_fzf="ps -o state= -o comm= -t '#{pane_tty}' \
	| grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

is_mutt="ps -o state= -o comm= -t '#{pane_tty}' \
	| grep -iqE '.neomutt-wrappe$'"

bind -n C-h run "($is_vim && tmux send-keys C-h) || \
												tmux select-pane -L"

bind -n C-j run "($is_vim && tmux send-keys C-j)  || \
											 ($is_fzf && tmux send-keys C-j) || \
											 ($is_mutt && tmux send-keys C-j) || \
											 tmux select-pane -D"

bind -n C-k run "($is_vim && tmux send-keys C-k) || \
												($is_fzf && tmux send-keys C-k)  || \
                        ($is_mutt && tmux send-keys C-k) || \
												tmux select-pane -U"

bind -n C-l run  "($is_vim && tmux send-keys C-l) || \
												tmux select-pane -R"

# History
set-option -g history-limit 100000

# Fix ssh auth socket
set-environment -g 'SSH_AUTH_SOCK' ~/.ssh/ssh_auth_sock

#bells
set-option -g bell-action any

# reload config
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display-message "Config reloaded..."

# auto window rename
set-window-option -g automatic-rename on

bind i attach-session -c "#{pane_current_path}"

# color
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",st-256color:Tc"

bind-key f run "tmux split-window -l 12 'zsh -ci ftwind'"
